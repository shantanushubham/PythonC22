[project]
name = "payment-gateway-django"
version = "0.1.0"
description = "AirPay payment gateway: a Django REST framework API in front of the card, UPI and netbanking services"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "bcrypt>=5.0.0",
    "django>=6.1.2",
    "djangorestframework>=3.18.3",
    "djangorestframework-simplejwt>=5.5.1",
    "drf-spectacular>=0.30.0",
    "psycopg[binary]>=3.3.6",
]
