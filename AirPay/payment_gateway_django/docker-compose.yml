services:
  db:
    image: postgres:latest
    container_name: payment_gateway_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: payment_gateway_db
      POSTGRES_USER: payment_gateway_user
      POSTGRES_PASSWORD: payment_gateway_password
    ports:
      - "5432:5432"
    volumes:
      - ledgerdb_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payment_gateway_user -d payment_gateway_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  ledgerdb_data:
  redis_data: