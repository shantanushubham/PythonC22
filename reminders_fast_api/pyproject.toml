[project]
name = "reminders-fast-api"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.1",
    "fastapi>=0.162.0",
    "psycopg[binary]>=3.3.6",
    "pwdlib[argon2]>=0.3.1",
    "pydantic-settings>=2.16.2",
    "pyjwt>=2.15.1",
    "python-dotenv>=1.2.4",
    "sqlalchemy>=2.1.6",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "isort>=9.0.2",
    "pytest>=9.2.0",
    "tox>=4.67.5",
    "tox-uv>=1.37.2",
]

[tool.isort]
profile = "black"
line_length = 88
known_first_party = ["controller", "core", "models", "repositories", "schemas", "services", "utils", "app"]
skip = [".venv", ".tox", "alembic"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"
