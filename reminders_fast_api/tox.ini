[tox]
min_version = 4.22
requires = tox-uv
env_list = isort, py312

[testenv]
description = Run the test suite
runner = uv-venv-lock-runner
with_dev = true
commands = pytest {posargs}
setenv =
    JWT_SECRET = test-secret-not-for-production-0123456789
    LOG_LEVEL = WARNING

[testenv:isort]
description = Check import ordering
skip_install = true
commands = isort --check-only --diff .

[testenv:format]
description = Sort imports in place
skip_install = true
commands = isort .
